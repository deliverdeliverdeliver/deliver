<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DELIVER DELIVER DELIVER</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #161616;
    --panel: #d4d0c8;
    --dark: #101010;
    --blue: #000080;
    --green: #00aa00;
    --border-light: #ffffff;
    --border-dark: #404040;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.018) 0px,
            rgba(255,255,255,0.018) 1px,
            transparent 1px,
            transparent 4px
        ),
        #101010;

    font-family: "Courier New", monospace;
    color: white;
    overflow-x: hidden;
}

button,
input {
    font-family: "Courier New", monospace;
}


/* =========================
   LOGIN
========================= */

#authScreen {
    position: fixed;
    inset: 0;
    background: #101010;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.auth-window {
    width: min(430px, 92vw);
    background: var(--panel);
    color: black;
    border-top: 3px solid white;
    border-left: 3px solid white;
    border-right: 3px solid #444;
    border-bottom: 3px solid #444;
    box-shadow: 12px 12px 0 black;
}

.titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    font-weight: bold;
    padding: 8px 10px;
    letter-spacing: 1px;
}

.auth-content {
    padding: 28px;
}

.logo {
    text-align: center;
    font-weight: bold;
    font-size: 30px;
    margin-bottom: 25px;
    line-height: 1;
}

.logo small {
    display: block;
    font-size: 12px;
    margin-top: 10px;
}

label {
    display: block;
    margin-top: 13px;
    margin-bottom: 5px;
    font-weight: bold;
}

input {
    width: 100%;
    border: 2px inset white;
    padding: 10px;
    font-size: 16px;
    background: white;
}

.auth-buttons {
    margin-top: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.retro-button {
    border: 3px outset #eee;
    background: #c0c0c0;
    padding: 10px;
    font-weight: bold;
    cursor: pointer;
}

.retro-button:active {
    border-style: inset;
}

.auth-status {
    min-height: 40px;
    margin-top: 18px;
    padding: 8px;
    font-size: 13px;
    background: #eee;
    border: 2px inset white;
}


/* =========================
   GAME
========================= */

#game {
    display: none;
    min-height: 100vh;
}

.topbar {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 72px;
    background: #c0c0c0;
    border-bottom: 3px solid #fff;
    box-shadow: 0 4px 0 #444;
    color: black;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 18px;
    z-index: 100;
}

.icon-button {
    width: 54px;
    height: 54px;
    border: 3px outset #eee;
    background: #c0c0c0;
    cursor: pointer;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-button:active {
    border-style: inset;
}

.game-center {
    min-height: 100vh;
    padding: 120px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.site-title {
    text-align: center;
    font-size: clamp(28px, 5vw, 52px);
    letter-spacing: 4px;
    margin-bottom: 50px;
    text-shadow:
        4px 4px #000080,
        7px 7px #000;
}

.package-area {
    position: relative;
    text-align: center;
}

.package {
    width: 210px;
    height: 180px;
    position: relative;
    cursor: pointer;
    image-rendering: pixelated;
    transition: transform 0.08s;
    user-select: none;
}

.package:active {
    transform: translateY(8px) scale(.96);
}

.box-body {
    position: absolute;
    left: 15px;
    right: 15px;
    top: 48px;
    bottom: 0;
    background: #b56c2d;
    border: 8px solid #693a15;
    box-shadow:
        inset 8px 8px #d99450,
        inset -8px -8px #804519,
        10px 10px 0 #000;
}

.box-lid {
    position: absolute;
    top: 22px;
    left: 0;
    width: 210px;
    height: 62px;
    background: #c97a35;
    border: 8px solid #693a15;
    box-shadow:
        inset 8px 8px #e4a05c,
        inset -8px -8px #8b4c1d;
    z-index: 2;
}

.tape {
    position: absolute;
    width: 38px;
    top: 0;
    bottom: 0;
    left: 78px;
    background: #e0c17b;
    border-left: 4px solid #9f7d3d;
    border-right: 4px solid #9f7d3d;
}

.package-label {
    position: absolute;
    z-index: 5;
    background: white;
    color: black;
    padding: 5px 8px;
    left: 58px;
    top: 98px;
    font-size: 13px;
    border: 2px solid black;
    transform: rotate(-4deg);
}

.click-info {
    margin-top: 40px;
    text-align: center;
}

.progress-frame {
    width: min(400px, 85vw);
    height: 28px;
    margin: 12px auto;
    padding: 3px;
    border: 3px inset white;
    background: #c0c0c0;
}

.progress {
    height: 100%;
    width: 0%;
    background:
        repeating-linear-gradient(
            90deg,
            #000080 0px,
            #000080 15px,
            #0000aa 15px,
            #0000aa 18px
        );
    transition: width .2s;
}


/* =========================
   WINDOWS / MODALS
========================= */

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-window {
    width: min(760px, 95vw);
    max-height: 82vh;
    overflow: hidden;
    background: #c0c0c0;
    color: black;
    border: 3px outset white;
    box-shadow: 15px 15px 0 #000;
}

.modal-title {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 7px;
    font-weight: bold;
}

.close {
    width: 28px;
    background: #c0c0c0;
    border: 2px outset white;
    cursor: pointer;
    font-weight: bold;
}

.modal-content {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(82vh - 40px);
}


/* =========================
   INVENTORY
========================= */

.inventory-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
}

.item {
    border: 3px outset white;
    background: #ddd;
    padding: 10px;
    min-height: 145px;
    position: relative;
}

.item-name {
    font-weight: bold;
    margin-bottom: 7px;
}

.item-rarity {
    text-transform: uppercase;
    font-size: 12px;
}

.item-amount {
    position: absolute;
    right: 6px;
    bottom: 6px;
    background: black;
    color: white;
    padding: 3px 6px;
}

.common {
    border-bottom: 8px solid #888;
}

.uncommon {
    border-bottom: 8px solid #34a853;
}

.rare {
    border-bottom: 8px solid #1a73e8;
}

.epic {
    border-bottom: 8px solid #9933cc;
}

.legendary {
    border-bottom: 8px solid #ff9800;
}

.mythic {
    border-bottom: 8px solid #ff004c;
}


/* =========================
   DROP WINDOW
========================= */

.drop-item {
    text-align: center;
    padding: 30px;
}

.drop-item h2 {
    font-size: 32px;
    margin: 15px 0;
}

.drop-rarity {
    font-size: 18px;
    text-transform: uppercase;
    font-weight: bold;
}

.pixel-star {
    font-size: 60px;
    animation: pulse .6s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(.92); }
    to { transform: scale(1.08); }
}


/* =========================
   USER SEARCH
========================= */

.user-result {
    padding: 10px;
    margin-top: 8px;
    border: 2px inset white;
    background: white;
}


/* =========================
   STATUS
========================= */

#statusText {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 20px;
    background: #c0c0c0;
    color: black;
    border: 3px outset white;
    padding: 8px 15px;
    min-width: 220px;
    text-align: center;
    z-index: 50;
}

.username-display {
    position: fixed;
    top: 82px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    opacity: .7;
}


/* screen shake */

.shake {
    animation: shake .25s;
}

@keyframes shake {
    0% { transform: translate(0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(4px, -1px); }
    100% { transform: translate(0); }
}

    /* =========================
   CASE OPENING
========================= */


.mythic-glow {
    animation: mythicGlow .5s infinite alternate;
}

@keyframes mythicGlow {
    from {
        box-shadow: 0 0 10px #ff004c;
    }

    to {
        box-shadow:
            0 0 35px #ff004c,
            0 0 60px #ff004c;
    }
}

    /* =========================================
   DELIVERY RESULT - SINGLE ITEM
========================================= */

#dropContent {
    width: 100%;
}

.drop-result {
    width: 100%;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 30px 30px 35px;
    text-align: center;

    border-bottom: none !important;
}

/* ITEM BILD */

.drop-item-image,
.drop-item-placeholder {
    width: 120px;
    height: 120px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    object-fit: contain;
    image-rendering: pixelated;
}

.drop-item-placeholder {
    background: #222;
    border: 4px solid #666;

    color: white;
    font-size: 52px;
}

/* RARITY */

.drop-rarity {
    font-weight: bold;
    margin-bottom: 5px;
}

.drop-rarity-line {
    width: 100%;
    height: 8px;
    margin-bottom: 18px;
}

/* ITEM NAME */

.drop-item-name {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 14px;
}

/* BESCHREIBUNG */

.drop-item-description {
    font-size: 16px;
    line-height: 1.4;
}

/* RARITY FARBEN */

.drop-result.common .drop-rarity-line {
    background: #999;
}

.drop-result.uncommon .drop-rarity-line {
    background: #48b853;
}

.drop-result.rare .drop-rarity-line {
    background: #3478e5;
}

.drop-result.epic .drop-rarity-line {
    background: #9933cc;
}

.drop-result.legendary .drop-rarity-line {
    background: #f89000;
}

.drop-result.mythic .drop-rarity-line {
    background: #ff004c;
}

    /* FINAL DELIVERY WINDOW CLEANUP */

#dropContent {
    width: 100%;
    height: auto !important;
    min-height: 0 !important;
}

.drop-result {
    padding: 28px 30px 30px !important;
    min-height: 0 !important;
    height: auto !important;
}

/* Alte untere Linie entfernen */
.drop-result::after,
#dropContent::after {
    display: none !important;
}

/* Item etwas näher zusammenrücken */
.drop-item-image,
.drop-item-placeholder {
    margin-bottom: 16px !important;
}

.drop-rarity {
    margin-bottom: 6px !important;
}

.drop-rarity-line {
    margin-bottom: 16px !important;
}

.drop-item-name {
    margin-bottom: 10px !important;
}

.drop-item-description {
    margin-bottom: 0 !important;
}
</style>

</head>


<body>


<!-- =====================================
     LOGIN / REGISTRATION
===================================== -->

<div id="authScreen">

    <div class="auth-window">

        <div class="titlebar">
            DELIVER NETWORK LOGIN
        </div>

        <div class="auth-content">

            <div class="logo">
                DELIVER<br>
                DELIVER<br>
                DELIVER

                <small>
                    DIGITAL DELIVERY NETWORK v1.0
                </small>
            </div>

            <input
                id="username"

                maxlength="20"

                <button

                >

            <div
                class="auth-status"

<!-- =====================================

            class="icon-button"

        >

        </button>

        </div>

        <button

        </button>

        </div>

            <div
                class="package"
                id="package"
                onclick="clickPackage()"
            >

                <div class="box-lid">
                    <div class="tape"></div>
                </div>

</div>



<!-- =====================================
     INVENTORY
===================================== -->

<div
    class="modal-overlay"
    id="inventoryModal"
>

            <span>MY INVENTORY</span>

            <button
                class="close"
                onclick="closeModal('inventoryModal')"
            >

            </button>

        </div>

        <div class="modal-content">

    <div id="collectionStats" style="
        margin-bottom:20px;

        border:2px inset white;
        font-weight:bold;
    ">
        COLLECTION: 0 / 50
    </div>

    <div
        class="inventory-grid"
        id="inventoryGrid"
    ></div>

        </div>

    </div>

</div>



<!-- =====================================
     USERS
===================================== -->

<div
    class="modal-overlay"
    id="usersModal"
>

    <div class="modal-window">

        <div class="modal-title">

            <span>USER NETWORK</span>

            <button
                class="close"
                onclick="closeModal('usersModal')"
            >
                X
            </button>

        </div>

        <div class="modal-content">

            <input
                id="userSearch"

            >

            <br><br>

            <button

                onclick="searchUsers()"
            >
                SEARCH
            </button>

<!-- =====================================
     DROP

    id="dropModal"
>

        <div
            class="modal-content"

<script type="module">

/* =========================================
   CONFIGURATION

   HIER DEINEN PUBLISHABLE KEY EINTRAGEN
========================================= */

const SUPABASE_URL =
    "https://uzpkqbbpotfrsdjcljig.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QKLQNqaQBZNg6VMGdfvM-Q_xjSFoFi0";


const REGISTER_URL =
    `${SUPABASE_URL}/functions/v1/register-user`;

const LOGIN_URL =
    `${SUPABASE_URL}/functions/v1/login-user`;

const CLICK_URL =
    `${SUPABASE_URL}/functions/v1/click-package`;



/* =========================================
   STATE
========================================= */

let accessToken =
    localStorage.getItem("deliver_access_token");

let refreshToken =
    localStorage.getItem("deliver_refresh_token");

let currentUser =
    JSON.parse(
        localStorage.getItem("deliver_user") || "null"
    );

let clickLocked = false;



/* =========================================
   HELPERS
========================================= */

function setAuthStatus(message) {
    document.getElementById("authStatus").innerText =
        message;
}

function setStatus(message) {
    document.getElementById("statusText").innerText =
        message;
}


async function apiRequest(
    url,
    options = {},
    useAuth = false
) {

    const headers = {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        ...(options.headers || {})
    };

    if (useAuth && accessToken) {
        headers["Authorization"] =
            `Bearer ${accessToken}`;
    }

    const response = await fetch(url, {
        ...options,
        headers
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error ||
            data.message ||
            "Request failed"
        );
    }

    return data;
}



/* =========================================
   REGISTER
========================================= */

window.register = async function () {

    const username =
        document.getElementById("username")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    if (!username || !password) {
        setAuthStatus(
            "USERNAME UND PASSWORT EINGEBEN."
        );
        return;
    }

    setAuthStatus(
        "CREATING ACCOUNT..."
    );

    try {

        await apiRequest(
            REGISTER_URL,
            {
                method: "POST",
                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        setAuthStatus(
            "ACCOUNT CREATED. LOGGING IN..."
        );

        await performLogin(
            username,
            password
        );

    }

    catch (error) {

        console.error(error);

        setAuthStatus(
            "ERROR: " + error.message
        );

    }

};



/* =========================================
   LOGIN
========================================= */

window.login = async function () {

    const username =
        document.getElementById("username")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    if (!username || !password) {
        setAuthStatus(
            "USERNAME UND PASSWORT EINGEBEN."
        );
        return;
    }

    await performLogin(
        username,
        password
    );

};


async function performLogin(
    username,
    password
) {

    setAuthStatus(
        "CONNECTING..."
    );

    try {

        const data =
            await apiRequest(
                LOGIN_URL,
                {
                    method: "POST",
                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        accessToken =
            data.access_token;

        refreshToken =
            data.refresh_token;

        currentUser =
            data.user;


        localStorage.setItem(
            "deliver_access_token",
            accessToken
        );

        localStorage.setItem(
            "deliver_refresh_token",
            refreshToken
        );

        localStorage.setItem(
            "deliver_user",
            JSON.stringify(currentUser)
        );


        showGame();

    }

    catch (error) {

        console.error(error);

        setAuthStatus(
            "LOGIN FAILED: " +
            error.message
        );

    }

}



/* =========================================
   LOGOUT
========================================= */

window.logout = function () {

    localStorage.removeItem(
        "deliver_access_token"
    );

    localStorage.removeItem(
        "deliver_refresh_token"
    );

    localStorage.removeItem(
        "deliver_user"
    );

    location.reload();

};



/* =========================================
   SHOW GAME
========================================= */

async function showGame() {

    document.getElementById(
        "authScreen"
    ).style.display = "none";

    document.getElementById(
        "game"
    ).style.display = "block";

    document.getElementById(
        "currentUsername"
    ).innerText =
        "CONNECTED AS: " +
        currentUser.username;

    await loadProgress();

}



/* =========================================
   PROGRESS
========================================= */

async function loadProgress() {

    if (!currentUser)
        return;

    try {

        const url =
            `${SUPABASE_URL}/rest/v1/click_progress` +
            `?user_id=eq.${currentUser.id}` +
            `&select=*`;

        const response =
            await fetch(url, {

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${accessToken}`
                }

            });

        if (!response.ok)
            throw new Error(
                "Progress konnte nicht geladen werden."
            );

        const rows =
            await response.json();

        if (!rows.length)
            return;

        updateProgress(rows[0]);

    }

    catch (error) {

        console.error(error);

        setStatus(
            "CONNECTION ERROR"
        );

    }

}



function updateProgress(data) {

    const clicks =
        data.clicks_since_drop || 0;

    const total =
        data.total_clicks || 0;

    document.getElementById(
        "clickText"
    ).innerText =
        `${clicks} / 10 CLICKS`;

    document.getElementById(
        "totalClicks"
    ).innerText =
        `TOTAL CLICKS: ${total}`;

    document.getElementById(
        "progress"
    ).style.width =
        `${clicks * 10}%`;

}



/* =========================================
   PACKAGE CLICK
========================================= */

window.clickPackage =
async function () {

    if (clickLocked)
        return;

    clickLocked = true;

    const box =
        document.getElementById("package");

    box.classList.add("shake");

    setTimeout(() => {
        box.classList.remove("shake");
    }, 250);


    try {

        const data =
            await apiRequest(
                CLICK_URL,
                {
                    method: "POST",
                    body: "{}"
                },
                true
            );


        updateProgress({
            clicks_since_drop:
                data.clicks_since_drop,

            total_clicks:
                data.total_clicks
        });


        if (data.drop) {

            setStatus(
                "DELIVERY RECEIVED!"
            );

            showDrop(data.item);

            await loadInventory();

        }

        else {

            setStatus(
                data.clicks_remaining +
                " CLICKS UNTIL DELIVERY"
            );

        }

    }

    catch (error) {

        console.error(error);

        setStatus(
            "ERROR: " + error.message
        );

    }

    finally {

        setTimeout(() => {
            clickLocked = false;
        }, 150);

    }

};



/* =========================================
   DROP DISPLAY
========================================= */

function showDrop(item) {
    const modal = document.getElementById("dropModal");
    const content = document.getElementById("dropContent");

    const rarity = (item.rarity || "common").toLowerCase();

    const image = item.image_url
        ? `
            <img
                src="${escapeHtml(item.image_url)}"
                alt="${escapeHtml(item.name)}"
                class="drop-item-image"
            >
        `
        : `
            <div class="drop-item-placeholder">
                ${getItemSymbol(item.name)}
            </div>
        `;

    content.innerHTML = `
        <div class="drop-result ${rarity}">
            
            ${image}

            <div class="drop-rarity">
                ${escapeHtml(rarity.toUpperCase())}
            </div>

            <div class="drop-rarity-line"></div>

            <div class="drop-item-name">
                ${escapeHtml(item.name)}
            </div>

            <div class="drop-item-description">
                ${escapeHtml(item.description || "")}
            </div>

        </div>
    `;

    modal.style.display = "flex";
}

   
    
    function getItemSymbol(name) {

    if (
        name.toLowerCase()
        .includes("floppy")
    )
        return "💾";

    if (
        name.toLowerCase()
        .includes("monitor")
    )
        return "🖥";

    if (
        name.toLowerCase()
        .includes("mouse")
    )
        return "🖱";

    if (
        name.toLowerCase()
        .includes("cd")
    )
        return "💿";

    if (
        name.toLowerCase()
        .includes("folder")
    )
        return "📁";

    if (
        name.toLowerCase()
        .includes("hourglass")
    )
        return "⌛";

    return "★";
}
    


/* =========================================
   INVENTORY
========================================= */

window.openInventory =
async function () {

    document.getElementById(
        "inventoryModal"
    ).style.display =
        "flex";

    await loadInventory();

};



async function loadInventory() {

    if (!currentUser)
        return;


    const url =
        `${SUPABASE_URL}/rest/v1/inventory` +
        `?user_id=eq.${currentUser.id}` +
        `&select=amount,items(id,name,rarity,description,image_url,item_value)` +
        `&order=id.desc`;


    try {

        const response =
            await fetch(url, {

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${accessToken}`
                }

            });


        if (!response.ok)
            throw new Error(
                "Inventar konnte nicht geladen werden."
            );


        const inventory =
            await response.json();

const uniqueItems = inventory.length;

const totalValue = inventory.reduce(
    (sum, row) => {
        return sum +
            ((row.items.item_value || 0) * row.amount);
    },
    0
);

const percentage =
    Math.round((uniqueItems / 50) * 100);

document.getElementById(
    "collectionStats"
).innerHTML = `
    COLLECTION: ${uniqueItems} / 50
    (${percentage}%)
    <br>
    INVENTORY VALUE: ${totalValue}
`;
        const grid =
            document.getElementById(
                "inventoryGrid"
            );


        if (!inventory.length) {

            grid.innerHTML = `
                <p>
                    INVENTORY EMPTY.
                    <br><br>
                    CLICK THE PACKAGE.
                </p>
            `;

            return;

        }


   grid.innerHTML =
    inventory.map(row => {

        const item = row.items;

        return `
            <div class="item ${escapeHtml(item.rarity)}">

                ${
                    item.image_url
                    ? `
                        <img
                            src="${escapeHtml(item.image_url)}"
                            alt="${escapeHtml(item.name)}"
                        >
                    `
                    : `
                        <div class="pixel-placeholder">
                            ${getItemSymbol(item.name)}
                        </div>
                    `
                }

                <div class="item-name">
                    ${escapeHtml(item.name)}
                </div>

                <div class="item-rarity">
                    ${escapeHtml(item.rarity)}
                </div>
<div style="
    margin-top:6px;
    font-weight:bold;
">
    VALUE: ${item.item_value}
</div>
                <p>
                    ${escapeHtml(item.description || "")}
                </p>

                <div class="item-amount">
                    x${row.amount}
                </div>

            </div>
        `;

    }).join("");

    }

    catch (error) {

        console.error(error);

    }

}



/* =========================================
   USER SEARCH
========================================= */

window.openUsers =
function () {

    document.getElementById(
        "usersModal"
    ).style.display =
        "flex";

};



window.searchUsers =
async function () {

    const search =
        document.getElementById(
            "userSearch"
        ).value
        .trim()
        .toLowerCase();


    const results =
        document.getElementById(
            "userResults"
        );


    if (!search) {
        results.innerHTML = "";
        return;
    }


    try {

        const encoded =
            encodeURIComponent(
                `*${search}*`
            );


        const url =
            `${SUPABASE_URL}/rest/v1/profiles` +
            `?username=ilike.${encoded}` +
            `&select=id,username` +
            `&limit=20`;


        const response =
            await fetch(url, {

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${accessToken}`
                }

            });


        const users =
            await response.json();


        if (!users.length) {

            results.innerHTML =
                "<p>NO USERS FOUND.</p>";

            return;

        }


        results.innerHTML =
            users.map(user => `

                <div class="user-result">

                    <strong>
                        ${escapeHtml(user.username)}
                    </strong>

                    ${
                        user.id === currentUser.id
                        ? " (YOU)"
                        : ""
                    }

                </div>

            `).join("");

    }

    catch (error) {

        console.error(error);

        results.innerHTML =
            "<p>SEARCH ERROR.</p>";

    }

};



/* =========================================
   MODAL
========================================= */

window.closeModal =
function (id) {

    document.getElementById(
        id
    ).style.display =
        "none";

};



/* =========================================
   SECURITY
========================================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}



/* =========================================
   INITIALIZATION
========================================= */

if (
    accessToken &&
    currentUser
) {

    showGame();

}

</script>
